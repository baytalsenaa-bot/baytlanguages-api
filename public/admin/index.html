<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>لوحة إدارة بيت اللغات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<div id="login-screen" class="login-screen" style="display:none">
  <div class="login-card">
    <h1>بيت اللغات</h1>
    <p class="sub">تسجيل الدخول للوحة الإدارة</p>
    <form id="login-form">
      <div class="field">
        <label>البريد الإلكتروني</label>
        <input type="email" id="login-email" required autocomplete="username" />
      </div>
      <div class="field">
        <label>كلمة المرور</label>
        <input type="password" id="login-password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary">تسجيل الدخول</button>
      <div class="error-msg" id="login-error" style="display:none"></div>
    </form>
  </div>
</div>

<div id="app-shell" class="app-shell" style="display:none">
  <aside class="sidebar">
    <h2>بيت اللغات</h2>
    <nav>
      <a href="#/dashboard" data-route="dashboard">الرئيسية</a>
      <a href="#/quote-requests" data-route="quote-requests">طلبات الترجمة</a>
      <a href="#/documents" data-route="documents">المستندات</a>
      <a href="#/audit-log" data-route="audit-log">سجل العمليات</a>
    </nav>
    <div class="user-box">
      <div class="name" id="user-name"></div>
      <button class="logout-btn" id="logout-btn">تسجيل الخروج</button>
    </div>
  </aside>
  <main class="main" id="main-content">
    <div class="loading">جارٍ التحميل...</div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script src="admin.js"></script>
</body>
</html>
